name: ci

on:
    push:
        branches: ['**']
    pull_request:

jobs:
    verify:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest
            - run: bun install --frozen-lockfile
            - run: bun run typecheck
            - run: bun run format:check
            - run: bun run smoke:65
            - run: bun run smoke:keypad
            - run: bun run export:65
            - run: bun run export:65-fdm
            - run: bun run export:keypad
            - run: bun run build
